services:
  lb:
    image: ghcr.io/yanpitangui/rinha-de-backend-2026-q1-vptree-lb:10a1d9e222d5c56ac67115993037ac1528fe66c8
    ports:
      - "9999:9999"
    volumes:
      - uds-sockets:/sockets
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "10MB"

  api1:
    image: ghcr.io/yanpitangui/rinha-de-backend-2026-q1-vptree:10a1d9e222d5c56ac67115993037ac1528fe66c8
    hostname: api1
    environment:
      - TP_MIN_WORKERS=${TP_MIN_WORKERS:-64}
    volumes:
      - uds-sockets:/sockets
    healthcheck:
      test: ["CMD-SHELL", "test -S /sockets/api1.sock"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "160MB"

  api2:
    image: ghcr.io/yanpitangui/rinha-de-backend-2026-q1-vptree:10a1d9e222d5c56ac67115993037ac1528fe66c8
    hostname: api2
    environment:
      - TP_MIN_WORKERS=${TP_MIN_WORKERS:-64}
    volumes:
      - uds-sockets:/sockets
    healthcheck:
      test: ["CMD-SHELL", "test -S /sockets/api2.sock"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "160MB"

volumes:
  uds-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,mode=0777"
