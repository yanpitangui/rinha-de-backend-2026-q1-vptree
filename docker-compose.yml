services:
  lb:
    image: ghcr.io/yanpitangui/rinha-de-backend-2026-q1-vptree-lb:640918ba3546d2bc016fc4b19296873ae0f6a81c
    ports:
      - "9999:9999"
    volumes:
      - uds-sockets:/sockets
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "10MB"

  api1:
    image: ghcr.io/yanpitangui/rinha-de-backend-2026-q1-vptree:640918ba3546d2bc016fc4b19296873ae0f6a81c
    hostname: api1
    cpuset: "0,1"
    environment:
      - TP_MIN_WORKERS=${TP_MIN_WORKERS:-150}
      - DOTNET_PROCESSOR_COUNT=1
      - SO_BUSY_POLL=${SO_BUSY_POLL:-50}
    volumes:
      - uds-sockets:/sockets
    healthcheck:
      test: ["CMD-SHELL", "test -S /sockets/api1.sock"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "160MB"

  api2:
    image: ghcr.io/yanpitangui/rinha-de-backend-2026-q1-vptree:640918ba3546d2bc016fc4b19296873ae0f6a81c
    hostname: api2
    cpuset: "2,3"
    environment:
      - TP_MIN_WORKERS=${TP_MIN_WORKERS:-150}
      - DOTNET_PROCESSOR_COUNT=1
      - SO_BUSY_POLL=${SO_BUSY_POLL:-50}
    volumes:
      - uds-sockets:/sockets
    healthcheck:
      test: ["CMD-SHELL", "test -S /sockets/api2.sock"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "160MB"

volumes:
  uds-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,mode=0777"
